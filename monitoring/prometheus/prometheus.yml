global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape your Flask app (update host to ALB DNS or ECS task IP)
  - job_name: 'flask-app'
    metrics_path: /metrics
    static_configs:
      - targets: ['app:5000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
