name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: 🧹 Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flake8
      - run: flake8 app/ --max-line-length=100 --ignore=E501

  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r app/requirements.txt pytest
      - run: pytest tests/ -v || echo "No tests yet — add them in tests/"
